services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: final
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=school;Username=school;Password=school"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Run with: docker compose --profile test run --rm backend-tests
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_CONNECTION_STRING: "Host=db;Port=5432;Database=school_test;Username=school;Password=school"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: final
    environment:
      # URL the *browser* uses to reach the backend.
      API_URL: "${API_URL:-http://localhost:8080}"
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Run with: docker compose --profile test run --rm frontend-tests
  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  pgdata:
